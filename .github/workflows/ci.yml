name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      # Spec 013 (TDD-008): 100% do código novo do cardápio e todo mutante do domínio morto.
      - run: pnpm test:menu
      - run: pnpm test:mutation

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurante
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/restaurante
      DATABASE_URL: postgres://app_login:app_login@localhost:5432/restaurante
      BETTER_AUTH_SECRET: segredo-da-ci-com-mais-de-trinta-e-dois-caracteres
      BETTER_AUTH_URL: http://localhost:3000
      MAILER: file
      MAIL_DIR: .mail
      MENU_PHOTOS: file
      MENU_PHOTO_DIR: .menu-photos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:dev-login
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          E2E_START: "pnpm start"

  # Testes de tela (spec 013): matriz de 9 telas, claro e escuro, Chromium e WebKit, com comparação
  # de imagem. Roda dentro da imagem oficial do Playwright para os pixels serem os da referência.
  telas:
    runs-on: ubuntu-latest
    needs: check
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurante
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@postgres:5432/restaurante
      DATABASE_URL: postgres://app_login:app_login@postgres:5432/restaurante
      BETTER_AUTH_SECRET: segredo-da-ci-com-mais-de-trinta-e-dois-caracteres
      BETTER_AUTH_URL: http://localhost:3000
      MAILER: file
      MAIL_DIR: .mail
      MENU_PHOTOS: file
      MENU_PHOTO_DIR: .menu-photos
      SCREENS_IN_CONTAINER: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:dev-login
      - run: pnpm build
      - run: pnpm test:screens
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: telas-diferencas
          path: test-results/
          retention-days: 7
